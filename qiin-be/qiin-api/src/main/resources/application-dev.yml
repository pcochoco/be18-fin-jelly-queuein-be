spring:
  cache:
    type: redis #none

  config:
    activate:
      on-profile: dev

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations:
      - classpath:db/migration/mariadb
      - classpath:db/seed/dev

  # Kafka 설정
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS} # Kafka 접속 정보 지정
    producer:
      #직렬화
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    topic:
      topics:
        reservation-event: reservation-event-topic

  # DB 설정: Spring 표준 키 사용 (Doppler에 있는 키와 매칭)
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  # Redis 및 Kafka는 Docker Compose 서비스 이름으로 설정 (Host만 재정의)
  data:
    redis:
      host: redis
      port: 6379

gemini:
  base-url: https://generativelanguage.googleapis.com/v1beta
  api-key: ${GEMINI_API_KEY}

  #답변 모델
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}

  #임베딩 모델
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
  temperature: 0.2

#document chunk에 대한 embedding 용
rag:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration/postgresql
  datasource:
    url: ${RAG_POSTGRES_DATASOURCE_URL}
    username: ${RAG_POSTGRES_DATASOURCE_USERNAME}
    password: ${RAG_POSTGRES_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
