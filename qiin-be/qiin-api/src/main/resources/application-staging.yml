
spring:
  cache:
    type:
      redis
  config:
    activate:
      on-profile: staging

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations:
      - classpath:db/migration
      - classpath:db/seed/dev

  # Kafka 설정
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS} # Kafka 접속 정보 지정
    producer:
      #직렬화
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    topic:
      topics:
        reservation-event: reservation-event-topic

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    root: INFO
    com.beyond.qiin: DEBUG

gemini:
  base-url: https://generativelanguage.googleapis.com/v1beta
  api-key: ${GEMINI_API_KEY}

  #답변 모델
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}

  #임베딩 모델
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
  temperature: 0.2

#document chunk에 대한 embedding 용
rag:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration/postgresql
  datasource:
    url: ${RAG_POSTGRES_DATASOURCE_URL}
    username: ${RAG_POSTGRES_DATASOURCE_USERNAME}
    password: ${RAG_POSTGRES_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
