buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.flywaydb:flyway-core:10.17.0'
        classpath 'org.flywaydb:flyway-mysql:10.17.0'
        classpath 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
    }
}

plugins {
    id 'org.springframework.boot' version '3.5.4' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '6.24.0' apply false
    id 'org.flywaydb.flyway' version '10.17.0' apply false
}

ext {
    springAiVersion = '1.0.3'
}

allprojects {
    group = 'com.beyond'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

tasks.register('updateGitHooks', Copy) {
    from rootProject.file('scripts/pre-commit')
    into rootProject.file('../.git/hooks')
}

tasks.register('makeGitHooksExecutable') {
    dependsOn updateGitHooks
    doLast {
        def osName = System.getProperty('os.name').toLowerCase()
        if (osName.contains('windows')) {
            println 'Skipping chmod (Windows detected) - Git hooks assumed already executable.'
        } else {
            def execOps = getServices().get(org.gradle.process.ExecOperations)
            execOps.exec {
                commandLine 'chmod', '+x', rootProject.file('../.git/hooks/pre-commit')
            }
        }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'org.flywaydb.flyway'

    description = 'qiin-be'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    ext {
        set('springAiVersion', rootProject.ext.springAiVersion)
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-aop'
        implementation 'org.springframework.kafka:spring-kafka'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-mail'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'org.springframework.boot:spring-boot-starter-cache'
        implementation 'org.redisson:redisson-spring-boot-starter:3.20.0'
        implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
        implementation 'io.github.openfeign.querydsl:querydsl-core:7.0'
        implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.0'
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-mysql'
        implementation 'org.flywaydb:flyway-database-postgresql'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'software.amazon.awssdk:s3:2.20.0'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
        runtimeOnly 'com.mysql:mysql-connector-j'
        runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
        runtimeOnly 'com.h2database:h2'
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

        implementation 'io.jsonwebtoken:jjwt-api:0.11.5'

        annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.0:jpa'
        annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
        annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
        annotationProcessor 'org.projectlombok:lombok'

        compileOnly 'org.projectlombok:lombok'
        developmentOnly 'org.springframework.boot:spring-boot-devtools'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.kafka:spring-kafka-test'
        testImplementation 'org.springframework.security:spring-security-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    flyway {
        url = 'jdbc:mariadb://localhost:3309/qiin'
        user = System.getenv('SPRING_DATASOURCE_USERNAME')
        password = System.getenv('SPRING_DATASOURCE_PASSWORD')
        driver = 'org.mariadb.jdbc.Driver'
        locations = ['classpath:db/migration', 'classpath:db/seed/dev']
    }

    spotless {
        java {
            importOrder()
            removeUnusedImports()
            palantirJavaFormat()
            targetExclude('src/main/generated/**/*.java')
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
        systemProperty 'spring.profiles.active', 'test'

        environment 'SPRING_DATASOURCE_URL', 'jdbc:h2:mem:testdb;MODE=MariaDB;DB_CLOSE_DELAY=-1'
        environment 'SPRING_DATASOURCE_USERNAME', 'sa'
        environment 'SPRING_DATASOURCE_PASSWORD', ''
        environment 'SPRING_DATASOURCE_DRIVER_CLASS_NAME', 'org.h2.Driver'
        environment 'REDIS_HOST', 'localhost'
        environment 'REDIS_PORT', '6379'
        environment 'KAFKA_BOOTSTRAP_SERVERS', 'localhost:9092'
        environment 'JWT_SECRET_KEY', 'test-secret-key-for-jwt-signing-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
        environment 'JWT_ACCESS_TOKEN_EXPIRATION', '60000'
        environment 'JWT_REFRESH_TOKEN_EXPIRATION', '120000'
    }

    def querydslSrcDir = 'src/main/generated'

    tasks.withType(JavaCompile).configureEach {
        options.getGeneratedSourceOutputDirectory().set(file(querydslSrcDir))
    }

    sourceSets {
        main.java.srcDirs += [querydslSrcDir]
        test.java.srcDirs += [querydslSrcDir]
    }

    clean {
        delete file(querydslSrcDir)
    }

    if (!System.getenv().containsKey('DOCKER_BUILD')) {
        compileJava.dependsOn rootProject.tasks.named('makeGitHooksExecutable')
    }
}
