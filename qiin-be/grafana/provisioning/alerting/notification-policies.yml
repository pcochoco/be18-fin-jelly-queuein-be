apiVersion: 1

policies:
  - orgId: 1
    receiver: slack-kafka-alerts
    group_by:
      - alertname
    group_wait: 0s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: slack-kafka-alerts
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 4h
        object_matchers:
          - ["component", "=", "kafka"]
          - ["severity", "=", "warning"]
          - ["service", "=", "notification-service"]
